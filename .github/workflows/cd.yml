name: CD

# After a push on main: run the whole CI first, then build and publish the two Docker images.
on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.service }} image
    needs: ci # nothing is published if lint, tests or build fail
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          # Two Docker Hub repositories: toolshare-frontend and toolshare-backend.
          # Tags: "latest" and the full commit SHA.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/toolshare-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/toolshare-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
